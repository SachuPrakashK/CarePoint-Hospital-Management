@if (confirmation.request(); as request) {
  <div class="backdrop" (click)="confirmation.answer(false)">
    <section
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      (click)="$event.stopPropagation()"
    >
      <button class="close" aria-label="Close" (click)="confirmation.answer(false)">
        <app-icon name="close" />
      </button>
      <div class="confirmation-icon" [class.approval-icon]="request.danger === false">
        <app-icon
          [name]="request.icon || (request.danger === false ? 'check-circle' : 'trash')"
          [size]="24"
        />
      </div>
      <h2 id="confirm-title">{{ request.title }}</h2>
      <p>{{ request.message }}</p>
      @if (request.context) {
        <div class="context">{{ request.context }}</div>
      }
      <footer>
        <button class="secondary" (click)="confirmation.answer(false)">
          {{ request.cancelLabel || 'Cancel' }}</button
        ><button
          [class]="request.danger === false ? 'primary' : 'danger'"
          (click)="confirmation.answer(true)"
        >
          {{ request.confirmLabel || 'Confirm' }}
        </button>
      </footer>
    </section>
  </div>
}

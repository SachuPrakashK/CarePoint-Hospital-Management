<div class="modal-overlay">
  <section
    class="crud-modal crud-modal--{{ size() }}"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shared-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="crud-modal__header">
      <div class="crud-modal__heading">
        @if (icon()) {
          <span class="crud-modal__header-icon" aria-hidden="true"
            ><app-icon [name]="icon()" [size]="21"
          /></span>
        }
        <div>
          <h2 id="shared-modal-title">{{ title() }}</h2>
          @if (description()) {
            <p>{{ description() }}</p>
          }
        </div>
      </div>
      <button
        class="modal-close"
        type="button"
        aria-label="Close"
        [disabled]="busy()"
        (click)="requestClose()"
      >
        <app-icon name="close" />
      </button>
    </div>
    <div class="crud-modal__content"><ng-content /></div>
  </section>
</div>

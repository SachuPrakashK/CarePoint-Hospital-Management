<div class="modal-overlay">
  <section
    class="crud-modal crud-modal--{{ size() }}"
    role="dialog"
    aria-modal="true"
    aria-labelledby="shared-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="crud-modal__header">
      <div>
        <h2 id="shared-modal-title">{{ title() }}</h2>
        @if (description()) { <p>{{ description() }}</p> }
      </div>
      <button class="modal-close" type="button" aria-label="Close" (click)="requestClose()">
        <app-icon name="close" />
      </button>
    </div>
    <ng-content />
  </section>
</div>

<div class="stack" aria-live="polite" aria-atomic="false">
  @for (item of toast.toasts(); track item.id) {
    <article [class]="item.kind" role="status">
      <span class="toast-icon" aria-hidden="true">
        <app-icon
          [name]="
            item.kind === 'success'
              ? 'check-circle'
              : item.kind === 'error'
                ? 'alert-circle'
                : 'help'
          "
          [size]="20"
        />
      </span>
      <p>{{ item.message }}</p>
      <button type="button" aria-label="Dismiss notification" (click)="toast.dismiss(item.id)">
        <app-icon name="close" [size]="16" />
      </button>
    </article>
  }
</div>

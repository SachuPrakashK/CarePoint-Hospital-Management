<form class="crud-modal__form" [formGroup]="form" (ngSubmit)="save()"><div class="crud-modal__body">@if (error()) { <div class="form-api-error" role="alert">{{ error() }}</div> }<div class="form-grid">
  <label class="field"><span class="form-label">First name <span class="required-indicator">*</span></span><input formControlName="firstName" placeholder="Enter first name" />@if (invalid('firstName','required')) { <span class="error">First name is required.</span> } @else if (invalid('firstName')) { <span class="error">Enter a valid first name.</span> }</label>
  <label class="field"><span class="form-label">Middle name</span><input formControlName="middleName" placeholder="Enter middle name" /></label>
  <label class="field"><span class="form-label">Last name <span class="required-indicator">*</span></span><input formControlName="lastName" placeholder="Enter last name" />@if (invalid('lastName')) { <span class="error">Enter a valid last name.</span> }</label>
  <label class="field"><span class="form-label">Date of birth <span class="required-indicator">*</span></span><input type="date" formControlName="dob" [max]="dates.today()" />@if (invalid('dob','futureDate')) { <span class="error">Date of birth cannot be in the future.</span> }</label>
  <label class="field"><span class="form-label">Gender <span class="required-indicator">*</span></span><select formControlName="gender"><option value="" disabled>Select gender</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select>@if (invalid('gender')) { <span class="error">Select a gender.</span> }</label>
  <label class="field"><span class="form-label">Blood group</span><select formControlName="bloodGroup"><option>Unknown</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></label>
  <label class="field"><span class="form-label">Phone <span class="required-indicator">*</span></span><input type="tel" inputmode="tel" formControlName="phone" placeholder="9876543210" />@if (invalid('phone')) { <span class="error">Enter a valid Indian mobile number.</span> }</label>
  <label class="field"><span class="form-label">Email</span><input type="email" formControlName="email" placeholder="Enter email address" />@if (invalid('email')) { <span class="error">Enter a valid email address.</span> }</label>
  <label class="field"><span class="form-label">City</span><input formControlName="city" placeholder="Enter city" /></label>
  <label class="field"><span class="form-label">Emergency Contact Number</span><input type="tel" inputmode="tel" formControlName="emergencyContact" placeholder="9876543210" />@if (invalid('emergencyContact')) { <span class="error">Enter a valid emergency contact number.</span> }</label>
  <label class="field full"><span class="form-label">Allergies</span><input formControlName="allergies" placeholder="Enter allergies separated by commas" /></label>
</div></div><div class="crud-modal__footer"><button class="primary" [disabled]="form.invalid || submitting()">{{ submitting() ? (mode() === 'edit' ? 'Updating…' : 'Creating…') : (mode() === 'edit' ? 'Update' : 'Create') }}</button></div></form>

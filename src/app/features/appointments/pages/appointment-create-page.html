<app-modal
  title="Add New Appointment"
  description="Choose a patient, physician and available appointment time."
  icon="calendar"
  size="xl"
  [dirty]="form.form.dirty"
  [busy]="form.saving()"
  (closed)="close()"
  ><app-appointment-form #form (saved)="created()" (cancelled)="close()"
/></app-modal>

<form class="crud-modal__form" [formGroup]="form" (ngSubmit)="save()">
  <div class="crud-modal__body">
    <div class="form-grid">
      <label class="field"
        ><span class="form-label">Temporary password <span class="required-indicator">*</span></span
        ><input
          type="password"
          formControlName="password"
          placeholder="Enter secure temporary password" /></label
      ><label class="field"
        ><span class="form-label">Confirm password <span class="required-indicator">*</span></span
        ><input
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm temporary password"
        />
        @if (form.controls.confirmPassword.hasError('mismatch')) {
          <span class="error">Passwords must match.</span>
        }
      </label>
    </div>
  </div>
  <div class="crud-modal__footer">
    <button class="primary" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Resetting...' : 'Reset Password' }}
    </button>
  </div>
</form>

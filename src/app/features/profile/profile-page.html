<a class="back-link" routerLink="/dashboard"><app-icon name="back" [size]="16"/> Back to dashboard</a><div class="breadcrumbs"><a routerLink="/dashboard">Dashboard</a> / Profile</div><div class="page-head"><div><h1>My profile</h1><p class="muted">Manage your account information and profile image.</p></div></div><div class="profile-grid"><section class="card photo-card"><div class="profile-photo">@if(auth.user()?.avatarUrl){<img [src]="auth.user()?.avatarUrl" alt="Profile image">}@else{<span>AS</span>}</div><h2>{{auth.user()?.name}}</h2><span class="status">Hospital Admin</span><label class="secondary button-link upload"><app-icon name="plus" [size]="17"/>{{uploading()?'Uploading…':'Select image'}}<input type="file" accept="image/jpeg,image/png,image/webp" (change)="selectImage($event)" [disabled]="uploading()"></label><button class="danger button-icon" (click)="deleteImage()" [disabled]="!auth.user()?.avatarUrl"><app-icon name="trash" [size]="17"/>Delete image</button><small>JPG, PNG or WebP. Maximum 5 MB.</small>@if(imageError()){<p class="error" role="alert">{{imageError()}}</p>}</section><form class="card" [formGroup]="form" (ngSubmit)="save()"><div class="section-title"><h2>Account information</h2></div><div class="form-grid"><label class="field">First name <span class="required">*</span><input formControlName="firstName" placeholder="Enter first name"></label><label class="field">Last name <span class="required">*</span><input formControlName="lastName" placeholder="Enter last name"></label><label class="field">Email address <span class="required">*</span><input type="email" formControlName="email" placeholder="Enter email address"></label><label class="field">Phone number <span class="required">*</span><input formControlName="phone" placeholder="Enter phone number"></label><label class="field">Role<input [value]="auth.user()?.role" readonly></label></div><div class="form-actions"><button type="button" class="secondary">Change password</button><button class="primary" [disabled]="form.invalid||saving()">{{saving()?'Saving…':'Save changes'}}</button></div></form></div>

<main class="center-page">
  <form class="simple-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand-mark">✚</div>
    <h1>{{ reset ? 'Choose a new password' : 'Reset your password' }}</h1>
    @if (!reset) {
      <p>Enter your account email. The response will not reveal whether an account exists.</p>
      <label class="field"
        ><span class="form-label">Email address <span class="required-indicator">*</span></span
        ><input
          type="email"
          formControlName="email"
          placeholder="name@hospital.com"
          autocomplete="email"
      /></label>
    } @else {
      <p>Choose a unique password of at least 12 characters.</p>
      <label class="field"
        ><span class="form-label">New password <span class="required-indicator">*</span></span
        ><input type="password" formControlName="password" autocomplete="new-password" /></label
      ><label class="field"
        ><span class="form-label">Confirm password <span class="required-indicator">*</span></span
        ><input type="password" formControlName="confirmation" autocomplete="new-password"
      /></label>
    }
    @if (message()) {
      <div role="status" class="alert">{{ message() }}</div>
    }
    <button class="primary" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Submitting…' : reset ? 'Reset password' : 'Send instructions' }}
    </button>
    <div class="auth-secondary-action" routerLink="/auth/login">← Back to sign in</div>
  </form>
</main>

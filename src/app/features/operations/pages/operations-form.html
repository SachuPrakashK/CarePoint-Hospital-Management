<form class="crud-modal__form" [formGroup]="form" (ngSubmit)="submit()"><div class="crud-modal__body"><div class="form-grid">
@if(kind()==='inventory'){<label class="field"><span class="form-label">Name <span class="required-indicator">*</span></span><input formControlName="name"></label><label class="field"><span class="form-label">Code</span><input formControlName="code"></label><label class="field"><span class="form-label">Category <span class="required-indicator">*</span></span><select formControlName="categoryId"><option value="">Select</option>@for(x of categories;track x.id){<option [value]="x.id">{{x.name}}</option>}</select></label><label class="field"><span class="form-label">Supplier</span><select formControlName="supplierId"><option value="">None</option>@for(x of store.suppliers();track x.id){<option [value]="x.id">{{x.name}}</option>}</select></label><label class="field"><span class="form-label">Unit <span class="required-indicator">*</span></span><input formControlName="unit"></label><label class="field"><span class="form-label">Store <span class="required-indicator">*</span></span><input formControlName="store"></label><label class="field"><span class="form-label">Opening quantity <span class="required-indicator">*</span></span><input type="number" min="0" formControlName="quantity"></label><label class="field"><span class="form-label">Reorder level <span class="required-indicator">*</span></span><input type="number" min="0" formControlName="reorderLevel"></label>}
@else if(kind()==='supplier'){<label class="field"><span class="form-label">Name <span class="required-indicator">*</span></span><input formControlName="name"></label><label class="field"><span class="form-label">Code <span class="required-indicator">*</span></span><input formControlName="code"></label><label class="field"><span class="form-label">Contact person</span><input formControlName="contactPerson"></label><label class="field"><span class="form-label">Phone</span><input type="tel" formControlName="phone"></label><label class="field"><span class="form-label">Email</span><input type="email" formControlName="email"></label><label class="field full"><span class="form-label">Address</span><textarea formControlName="address"></textarea></label>}
@else if(kind()==='ambulance'){<label class="field"><span class="form-label">Fleet number <span class="required-indicator">*</span></span><input formControlName="number"></label><label class="field"><span class="form-label">Registration <span class="required-indicator">*</span></span><input formControlName="registration"></label><label class="field"><span class="form-label">Vehicle type <span class="required-indicator">*</span></span><input formControlName="vehicleType"></label><label class="field"><span class="form-label">Driver</span><input formControlName="driver"></label><label class="field"><span class="form-label">Driver phone</span><input type="tel" formControlName="driverContact"></label><label class="field"><span class="form-label">Status <span class="required-indicator">*</span></span><select formControlName="status"><option>Available</option><option>Maintenance</option><option>Out of Service</option></select></label>}
@else{<label class="field"><span class="form-label">Supplier <span class="required-indicator">*</span></span><select formControlName="supplierId"><option value="">Select</option>@for(x of store.suppliers();track x.id){<option [value]="x.id">{{x.name}}</option>}</select></label><label class="field"><span class="form-label">Item type <span class="required-indicator">*</span></span><select formControlName="itemType"><option>Inventory</option><option>Medicine</option></select></label><label class="field"><span class="form-label">Item <span class="required-indicator">*</span></span><select formControlName="itemId"><option value="">Select</option>@if(form.controls.itemType.value==='Medicine'){@for(x of pharmacy.medicines();track x.id){<option [value]="x.id">{{x.name}}</option>}}@else{@for(x of store.inventory();track x.id){<option [value]="x.id">{{x.name}}</option>}}</select></label><label class="field"><span class="form-label">Quantity <span class="required-indicator">*</span></span><input type="number" min="1" formControlName="quantity"></label><label class="field"><span class="form-label">Unit price <span class="required-indicator">*</span></span><input type="number" min="0" formControlName="unitPrice"></label>}
</div>@if(error){<p class="error" role="alert">{{error}}</p>}</div><div class="crud-modal__footer"><button class="primary" type="submit" [disabled]="submitting">{{submitting?'Saving...':entity()?'Update':'Create'}}</button></div></form>

<form class="crud-modal__form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="crud-modal__body">
    <div class="form-grid">
      @if (kind() === 'inventory') {
        <label class="field"
          ><span class="form-label">Name <span class="required-indicator">*</span></span
          ><input formControlName="name" placeholder="Enter item name" /></label
        ><label class="field"
          ><span class="form-label">Code</span
          ><input formControlName="code" placeholder="Enter item code" /></label
        ><label class="field"
          ><span class="form-label">Category <span class="required-indicator">*</span></span
          ><select formControlName="categoryId">
            <option value="" disabled>
              {{
                optionsLoading
                  ? 'Loading categories…'
                  : categories.length
                    ? 'Select category'
                    : 'No categories available'
              }}
            </option>
            @for (x of categories; track x.id) {
              <option [value]="x.id">{{ x.name }}</option>
            }
          </select></label
        ><label class="field"
          ><span class="form-label">Supplier</span
          ><select formControlName="supplierId">
            <option value="" disabled>Select supplier</option>
            <option value="">No supplier</option>
            @for (x of suppliers; track x.id) {
              <option [value]="x.id">{{ x.name }}</option>
            }
          </select></label
        ><label class="field"
          ><span class="form-label">Unit <span class="required-indicator">*</span></span
          ><input formControlName="unit" placeholder="Enter unit, e.g. Pack" /></label
        ><label class="field"
          ><span class="form-label">Store <span class="required-indicator">*</span></span
          ><input formControlName="store" placeholder="Enter storage location" /></label
        ><label class="field"
          ><span class="form-label">Opening quantity <span class="required-indicator">*</span></span
          ><input
            type="number"
            min="0"
            formControlName="quantity"
            placeholder="Enter opening quantity" /></label
        ><label class="field"
          ><span class="form-label">Reorder level <span class="required-indicator">*</span></span
          ><input
            type="number"
            min="0"
            formControlName="reorderLevel"
            placeholder="Enter minimum stock level"
        /></label>
      } @else if (kind() === 'supplier') {
        <label class="field"
          ><span class="form-label">Name <span class="required-indicator">*</span></span
          ><input formControlName="name" placeholder="Enter supplier name" /></label
        ><label class="field"
          ><span class="form-label">Code <span class="required-indicator">*</span></span
          ><input formControlName="code" placeholder="Enter supplier code" /></label
        ><label class="field"
          ><span class="form-label">Contact person</span
          ><input formControlName="contactPerson" placeholder="Enter contact person name" /></label
        ><label class="field"
          ><span class="form-label">Phone</span
          ><input type="tel" formControlName="phone" placeholder="Enter contact number" /></label
        ><label class="field"
          ><span class="form-label">Email</span
          ><input type="email" formControlName="email" placeholder="Enter email address" /></label
        ><label class="field full"
          ><span class="form-label">Address</span
          ><textarea formControlName="address" placeholder="Enter supplier address"></textarea>
        </label>
        <label class="field"
          ><span class="form-label">Tax number</span
          ><input formControlName="taxNumber" placeholder="Enter tax number"
        /></label>
      } @else if (kind() === 'ambulance') {
        <label class="field"
          ><span class="form-label">Fleet number <span class="required-indicator">*</span></span
          ><input formControlName="number" placeholder="Enter fleet number" /></label
        ><label class="field"
          ><span class="form-label">Registration <span class="required-indicator">*</span></span
          ><input
            formControlName="registration"
            placeholder="Enter vehicle registration number" /></label
        ><label class="field"
          ><span class="form-label">Vehicle type <span class="required-indicator">*</span></span
          ><input formControlName="vehicleType" placeholder="Enter ambulance type" /></label
        ><label class="field"
          ><span class="form-label">Driver</span
          ><input formControlName="driver" placeholder="Enter assigned driver" /></label
        ><label class="field"
          ><span class="form-label">Driver phone</span
          ><input
            type="tel"
            formControlName="driverContact"
            placeholder="Enter driver contact number" /></label
        ><label class="field"
          ><span class="form-label">Status <span class="required-indicator">*</span></span
          ><select formControlName="status">
            <option value="" disabled>Select availability status</option>
            <option>Available</option>
            <option>Maintenance</option>
            <option>Out of Service</option>
          </select></label
        >
      } @else {
        <label class="field"
          ><span class="form-label">Supplier <span class="required-indicator">*</span></span
          ><select formControlName="supplierId">
            <option value="" disabled>
              {{
                optionsLoading
                  ? 'Loading suppliers…'
                  : suppliers.length
                    ? 'Select supplier'
                    : 'No suppliers available'
              }}
            </option>
            @for (x of suppliers; track x.id) {
              <option [value]="x.id">{{ x.name }}</option>
            }
          </select></label
        ><label class="field"
          ><span class="form-label">Item type <span class="required-indicator">*</span></span
          ><select formControlName="itemType">
            <option>Inventory</option>
            <option>Medicine</option>
          </select></label
        ><label class="field"
          ><span class="form-label">Item <span class="required-indicator">*</span></span
          ><select formControlName="itemId">
            <option value="" disabled>
              {{ optionsLoading ? 'Loading items…' : 'Select item' }}
            </option>
            @if (form.controls.itemType.value === 'Medicine') {
              @for (x of pharmacy.medicines(); track x.id) {
                <option [value]="x.id">{{ x.name }}</option>
              }
            } @else {
              @for (x of inventoryItems; track x.id) {
                <option [value]="x.id">{{ x.name }} · {{ x.code }}</option>
              }
            }
          </select></label
        ><label class="field"
          ><span class="form-label">Quantity <span class="required-indicator">*</span></span
          ><input
            type="number"
            min="1"
            formControlName="quantity"
            placeholder="Enter requested quantity" /></label
        ><label class="field"
          ><span class="form-label">Unit price <span class="required-indicator">*</span></span
          ><input type="number" min="0" formControlName="unitPrice" placeholder="Enter unit price"
        /></label>
      }
    </div>
    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }
  </div>
  <div class="crud-modal__footer">
    <button class="secondary" type="button" [disabled]="submitting" (click)="cancelled.emit()">
      Cancel
    </button>
    <button class="primary" type="submit" [disabled]="submitting">
      {{ submitting ? 'Saving...' : entity() ? 'Update' : 'Create' }}
    </button>
  </div>
</form>

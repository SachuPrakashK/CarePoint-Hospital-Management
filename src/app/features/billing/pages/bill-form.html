<form class="crud-modal__form" [formGroup]="form" (ngSubmit)="submit()"><div class="crud-modal__body"><label class="field"><span class="form-label">Patient <span class="required-indicator">*</span></span><select formControlName="patientId"><option value="">Select</option>@for(p of patients.patients();track p.id){<option [value]="p.id">{{p.firstName}} {{p.lastName}} · {{p.mrn}}</option>}</select></label><div formArrayName="items">@for(row of items.controls;track $index;let i=$index){<div class="form-grid" [formGroupName]="i"><label class="field"><span class="form-label">Description <span class="required-indicator">*</span></span><input formControlName="description"></label><label class="field"><span class="form-label">Source <span class="required-indicator">*</span></span><input formControlName="source"></label><label class="field"><span class="form-label">Quantity <span class="required-indicator">*</span></span><input type="number" min="0.01" step="0.01" formControlName="quantity"></label><label class="field"><span class="form-label">Unit price <span class="required-indicator">*</span></span><input type="number" min="0" step="0.01" formControlName="unitPrice"></label><button type="button" class="secondary" [disabled]="items.length===1" (click)="remove(i)">Remove item</button></div>}</div><button type="button" class="secondary" (click)="add()">+ Add item</button><p><strong>Backend-validated total: ₹{{total()}}</strong></p>@if(error){<p class="error">{{error}}</p>}</div><div class="crud-modal__footer"><button class="primary" [disabled]="submitting">{{submitting?'Saving...':entity()?'Update':'Create'}}</button></div></form>

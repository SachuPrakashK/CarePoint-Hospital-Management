<form class="crud-modal__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="crud-modal__body financial-form-body">
    @if (error) {
      <div class="form-error" role="alert">{{ error }}</div>
    }
    <section class="transaction-context">
      <div>
        <small>INVOICE</small><strong>{{ invoice().number }}</strong>
      </div>
      <div>
        <small>PATIENT</small><strong>{{ patientName() }}</strong
        ><span>{{ invoice().patient?.mrn }}</span>
      </div>
      <div>
        <small>PAYMENT DATE</small><strong>Recorded automatically</strong
        ><span>Server date and time</span>
      </div>
    </section>
    <section class="financial-summary">
      <div>
        <span>Invoice total</span><strong>{{ money(total()) }}</strong>
      </div>
      <div>
        <span>Already paid</span><strong>{{ money(paid()) }}</strong>
      </div>
      <div class="highlight">
        <span>Outstanding</span><strong>{{ money(outstanding()) }}</strong>
      </div>
    </section>
    <div class="modal-form-grid">
      <label class="field"
        ><span class="form-label">Payment amount <span class="required-indicator">*</span></span
        ><input
          type="number"
          min="0.01"
          [max]="outstanding()"
          step="0.01"
          formControlName="amount"
          placeholder="Enter payment amount"
        />
        @if (form.controls.amount.touched && form.controls.amount.invalid) {
          <span class="field-error">Enter an amount up to the outstanding balance.</span>
        }
      </label>
      <label class="field"
        ><span class="form-label">Payment method <span class="required-indicator">*</span></span
        ><select formControlName="method">
          <option value="" disabled>Select payment method</option>
          <option value="Cash">Cash</option>
          <option value="Card">Card</option>
          <option value="Bank Transfer">Bank transfer</option>
          <option value="UPI">UPI / digital payment</option>
          <option value="Insurance">Insurance</option>
        </select></label
      >
      <label class="field modal-form-span"
        ><span class="form-label">Transaction reference</span
        ><input
          formControlName="reference"
          maxlength="100"
          placeholder="Enter receipt or transaction reference"
      /></label>
    </div>
  </div>
  <footer class="crud-modal__footer">
    <button type="button" class="secondary" [disabled]="submitting" (click)="cancelled.emit()">
      Cancel</button
    ><button class="primary" type="submit" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Saving…' : 'Save Payment' }}
    </button>
  </footer>
</form>
